name: Generate and Deploy Docs

on:
  push:
    branches: [main] 

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: stable
      - run: nim doc --project --outdir=docs/html src/nimpi/mpi.nim
      - name: Ensure Pages entrypoint
        run: |
          set -euo pipefail
          test -d docs/html
          target=""
          for candidate in \
            "mpi.html" \
            "nimpi/mpi.html" \
            "nimpi_mpi.html" \
            "theindex.html" \
            "nimpi.html"; do
            if [ -f "docs/html/$candidate" ]; then
              target="$candidate"
              break
            fi
          done

          if [ -z "$target" ]; then
            echo "No suitable landing page generated in docs/html"
            find docs/html -maxdepth 2 -type f -name '*.html' | sort
            exit 1
          fi

          cat > docs/html/index.html <<EOF
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta http-equiv="refresh" content="0; url=./$target" />
            <link rel="canonical" href="./$target" />
            <title>Redirecting...</title>
          </head>
          <body>
            <p>Redirecting to <a href="./$target">./$target</a></p>
          </body>
          </html>
          EOF
          echo "Created docs/html/index.html redirect to $target"
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/html
