name: Generate and Deploy Docs

on:
  push:
    branches: [main] 

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v1
        with:
          nim-version: stable
      - run: nim doc --project --outdir=docs/html src/nimpi.nim
      - name: Ensure Pages entrypoint
        run: |
          set -euo pipefail
          test -d docs/html
          if [ -f docs/html/index.html ]; then
            echo "index.html already exists"
          elif [ -f docs/html/theindex.html ]; then
            cp docs/html/theindex.html docs/html/index.html
          elif [ -f docs/html/nimpi.html ]; then
            cp docs/html/nimpi.html docs/html/index.html
          else
            echo "No suitable landing page generated in docs/html"
            ls -la docs/html
            exit 1
          fi
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./docs/html
